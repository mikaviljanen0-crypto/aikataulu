name: CI

on:
  pull_request:
  push:
    branches:
      - snedo-aikataulu-1-1-kaytettavyys
      - snedo-aikataulu-1-6-yhteistallennus

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Calendar and regression tests
        run: npm test
      - name: Production build
        # Report build errors even when lint fails, without hiding lint failures.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  windows-dev-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start Webpack dev server and verify localhost
        run: node tests/windows-smoke.mjs

  offline-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Precompile portal Snedo Aikataulu 1.6
        run: npm run build
        env:
          SNEDO_STATIC_EXPORT: '1'
          SNEDO_PORTAL_MODE: '1'
          NEXT_PUBLIC_SNEDO_PORTAL_MODE: '1'
      - name: Verify portal static package
        shell: bash
        run: |
          test -f out/index.html
          grep -q 'Snedo Aikataulu' out/index.html
          grep -q '/aikataulu/_next/' out/index.html
          test -f server/server.mjs
          test -f PORTAALI-KAYTTOONOTTO.md
      - uses: actions/upload-artifact@v4
        with:
          name: Snedo-Aikataulu-1.6-Portaali
          path: |
            out/
            server/
            PORTAALI-KAYTTOONOTTO.md
          if-no-files-found: error
          retention-days: 14

  browser-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build offline release
        run: npm run build
        env:
          SNEDO_STATIC_EXPORT: '1'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Open program and click Projects
        run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-debug
          path: browser-smoke-failure.png
          if-no-files-found: ignore

  windows-browser-interaction:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Precompile static release
        run: npm run build
        env:
          SNEDO_STATIC_EXPORT: '1'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Test interactivity on Windows
        run: node tests/browser-smoke.mjs
