name: CI

on:
  pull_request:
  push:
    branches:
      - snedo-aikataulu-1-1-kaytettavyys

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Calendar and regression tests
        run: npm test
      - name: Production build
        # Report build errors even when lint fails, without hiding lint failures.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
